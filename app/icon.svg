<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#F3F4F6"/>

  <!-- Three people silhouettes -->
  <!-- Left person -->
  <circle cx="20" cy="24" r="6" fill="#4B5563"/>
  <path d="M12 48 C12 38, 20 38, 20 38 C20 38, 28 38, 28 48" fill="#4B5563"/>

  <!-- Center person (slightly larger and forward) -->
  <circle cx="32" cy="22" r="7" fill="#374151"/>
  <path d="M22 48 C22 36, 32 36, 32 36 C32 36, 42 36, 42 48" fill="#374151"/>

  <!-- Right person -->
  <circle cx="44" cy="24" r="6" fill="#4B5563"/>
  <path d="M36 48 C36 38, 44 38, 44 38 C44 38, 52 38, 52 48" fill="#4B5563"/>

  <!-- Base line -->
  <rect y="48" width="64" height="16" fill="#E5E7EB"/>
</svg>
